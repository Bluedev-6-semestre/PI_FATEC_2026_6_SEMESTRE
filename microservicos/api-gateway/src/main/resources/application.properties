
spring.application.name=api-gateway

server.port=8080

# Enderecos dos microservicos
services.user.url=${USER_SERVICE_URL:http://localhost:8083}
services.machine.url=${MACHINE_SERVICE_URL:http://localhost:8081}
services.occurrence.url=${OCCURRENCE_SERVICE_URL:http://localhost:8082}

# Rotas
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=machine-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.machine.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/maquinas/**

spring.cloud.gateway.server.webflux.routes[2].id=occurrence-service
spring.cloud.gateway.server.webflux.routes[2].uri=${services.occurrence.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ocorrencias/**


# Swagger UI - documentacoes dos microservicos
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/docs/user/v3/api-docs

springdoc.swagger-ui.urls[1].name=Machine Service
springdoc.swagger-ui.urls[1].url=/docs/machine/v3/api-docs

springdoc.swagger-ui.urls[2].name=Occurrence Service
springdoc.swagger-ui.urls[2].url=/docs/occurrence/v3/api-docs

# Rota para documentacao do user-service
spring.cloud.gateway.server.webflux.routes[3].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/user/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

# Rota para documentacao do machine-service
spring.cloud.gateway.server.webflux.routes[4].id=machine-service-docs
spring.cloud.gateway.server.webflux.routes[4].uri=${services.machine.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/machine/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

# Rota para documentacao do occurrence-service
spring.cloud.gateway.server.webflux.routes[5].id=occurrence-service-docs
spring.cloud.gateway.server.webflux.routes[5].uri=${services.occurrence.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/occurrence/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs
