spring.application.name=machine-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bluedev_machine}
spring.datasource.username=${DB_USERNAME:machine_user}
spring.datasource.password=${DB_PASSWORD:machine_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


