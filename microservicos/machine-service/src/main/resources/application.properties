spring.application.name=machine-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bluedev}
spring.datasource.username=${DB_USERNAME:bluedev}
spring.datasource.password=${DB_PASSWORD:bluedev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false



