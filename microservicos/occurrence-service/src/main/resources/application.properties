spring.application.name=occurrence-service
server.port=8082

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bluedev}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: a tabela já existe e não criaremos outra migration neste serviço
spring.flyway.enabled=false

# Endereço do machine-service
machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8081}