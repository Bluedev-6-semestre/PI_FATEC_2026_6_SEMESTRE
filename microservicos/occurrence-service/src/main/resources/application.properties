spring.application.name=occurrence-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bluedev_occurrence}
spring.datasource.username=${DB_USERNAME:occurrence_user}
spring.datasource.password=${DB_PASSWORD:occurrence_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8081}

# Fotos das ocorrências (no Docker a pasta é um volume; ver docker-compose.yml)
ocorrencias.imagens.diretorio=${IMAGENS_DIR:uploads/ocorrencias}
ocorrencias.imagens.tamanho-maximo=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB