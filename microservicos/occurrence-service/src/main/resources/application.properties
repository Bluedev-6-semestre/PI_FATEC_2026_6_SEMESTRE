spring.application.name=occurrence-service
server.port=8082

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bluedev}
spring.datasource.username=${DB_USERNAME:bluedev}
spring.datasource.password=${DB_PASSWORD:bluedev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: a tabela já existe e não criaremos outra migration neste serviço
spring.flyway.enabled=false

# Endereço do machine-service
machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8081}

# Amazon S3 - sem credenciais fixas; utiliza a Default Credentials Provider Chain do AWS SDK
app.s3.region=${AWS_REGION:us-east-1}
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.presigned-url-expiration=${AWS_S3_PRESIGNED_URL_EXPIRATION:15m}
app.s3.max-file-size=${AWS_S3_MAX_FILE_SIZE:5MB}

# Limites HTTP alinhados ao limite de upload do S3
spring.servlet.multipart.max-file-size=${AWS_S3_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${AWS_S3_MAX_REQUEST_SIZE:6MB}
