
services:
  mariadb:
    image: mariadb:10.11
    container_name: bluedev-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: bluedev_root
    ports:
      - "3307:3306"
    volumes:
      - bluedev-db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  machine-service:
    build:
      context: ./microservicos/machine-service
    container_name: bluedev-machine-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mariadb:3306/bluedev_machine
      DB_USERNAME: machine_user
      DB_PASSWORD: machine_pass
    depends_on:
      mariadb:
        condition: service_healthy

  occurrence-service:
    build:
      context: ./microservicos/occurrence-service
    container_name: bluedev-occurrence-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mariadb:3306/bluedev_occurrence
      DB_USERNAME: occurrence_user
      DB_PASSWORD: occurrence_pass
      MACHINE_SERVICE_URL: http://machine-service:8081
      IMAGENS_DIR: /app/uploads/ocorrencias
    volumes:
      # Fotos das ocorrências: sem volume elas somem quando o contêiner é recriado.
      - bluedev-occurrence-uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      machine-service:
        condition: service_started

  user-service:
    build:
      context: ./microservicos/user-service
    container_name: bluedev-user-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mariadb:3306/bluedev_user
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
    depends_on:
      mariadb:
        condition: service_healthy
      machine-service:
        condition: service_started

  api-gateway:
    build:
      context: ./microservicos/api-gateway
    container_name: bluedev-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8083
      MACHINE_SERVICE_URL: http://machine-service:8081
      OCCURRENCE_SERVICE_URL: http://occurrence-service:8082
    depends_on:
      - machine-service
      - occurrence-service
      - user-service

volumes:
  bluedev-db-data:
  bluedev-occurrence-uploads:
